name: Deploy Ma'had Ali to IDwebhost (FTP)

# First deployment is manual. Enable push trigger only after verifying
# the FTP directory and completing a successful test deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahad-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload application to IDwebhost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "::error::Set FTP_SERVER secret"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "::error::Set FTP_USERNAME secret"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::Set FTP_PASSWORD secret"; exit 1; }
          if [ "$FTP_USERNAME" = "mahad.ftp@mahad.ali.yayasanluqmanulhakimmarelan.com" ]; then
            echo "::error::Akun FTP lama mengarah ke subfolder mahad.ftp. Ganti FTP_USERNAME dan FTP_PASSWORD secrets dengan akun khusus Document Root subdomain."
            exit 1
          fi
          echo "FTP deployment directory: ./ (root akun FTP khusus subdomain)."

      - name: Deploy application using FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          # FTP account is chrooted to the verified subdomain document root.
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/README.md
            **/.htaccess
            **/.user.ini
            **/php.ini
            **/config.php
            **/config.example.php
            **/database/**
            **/uploads/**
            **/*.sql
            **/*.log
